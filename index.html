<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSI 七層模型</title>
<meta name="description" content="以兩座七層層架互動導覽網路 OSI 七層：各層職責、Encapsulation 與 Decapsulation、TCP/IP 對照與情境測驗。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Noto Sans TC",ui-monospace,monospace;
  --bg:#F3F3F1; --ink:#161616; --ink2:#55575A; --ink3:#8E9093;
  --rule:rgba(22,22,22,.16); --btn:rgba(255,255,255,.72); --card:rgba(255,255,255,.66);
  --l7:#C8553D; --l6:#D99A1E; --l5:#8A9A3B; --l4:#2E9A8C; --l3:#4A7DC0; --l2:#6E5BB0; --l1:#6B6E72;
  --ok:#2E9A8C; --bad:#C8553D;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --ink:#ECECE8; --ink2:#A9ABAD; --ink3:#76787B;
    --rule:rgba(236,236,232,.16); --btn:rgba(32,33,35,.72); --card:rgba(32,33,35,.66);
    --l1:#9A9DA1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --ink:#ECECE8; --ink2:#A9ABAD; --ink3:#76787B;
  --rule:rgba(236,236,232,.16); --btn:rgba(32,33,35,.72); --card:rgba(32,33,35,.66);
  --l1:#9A9DA1; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--mono)}

#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0,var(--bg) 380px,transparent 620px);opacity:.92;transition:background .4s}

/* 雙塔圖 */
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.osi-fig{position:relative;container-type:inline-size;outline:none}
.osi-fig svg{display:block;width:100%;height:auto}
.osi-blk{--m:1;transition:transform .75s var(--anatomy-ease),opacity .45s ease}
.osi-blk[data-snap]{transition:none}
.osi-blk[data-lift]{transform:translateY(calc(var(--lift) * -1px))}
.osi-blk[data-hide]{opacity:0}
.osi-blk[data-st="dim"]{--m:.32}
.osi-blk[data-st="pick"]{--m:.6}
.osi-blk .iso-fill{fill:color-mix(in srgb,var(--c) calc(var(--m) * 55%),var(--anatomy-paper))}
.osi-blk .iso-top{fill:color-mix(in srgb,var(--c) calc(var(--m) * 82%),var(--anatomy-paper))}
.osi-blk .iso-shade[data-shade="0"]{fill:color-mix(in srgb,var(--c) calc(var(--m) * 40%),var(--anatomy-paper))}
.osi-blk .iso-shade[data-shade="1"]{fill:color-mix(in srgb,var(--c) calc(var(--m) * 48%),var(--anatomy-paper))}
.osi-blk .iso-shade[data-shade="2"]{fill:color-mix(in srgb,var(--c) calc(var(--m) * 56%),var(--anatomy-paper))}
.osi-blk .iso-shade[data-shade="3"]{fill:color-mix(in srgb,var(--c) calc(var(--m) * 64%),var(--anatomy-paper))}
.osi-blk .iso-edge{stroke:color-mix(in srgb,var(--c) calc(var(--m) * 55%),var(--anatomy-hi))}
.osi-blk .iso-line[data-tone="faint"],.osi-blk .iso-crease{stroke:color-mix(in srgb,var(--c) 45%,var(--anatomy-paper))}
.osi-blk[data-st="on"] .iso-edge{stroke:var(--anatomy-lit)}
.osi-tray[data-st="on"] .iso-edge{stroke:var(--anatomy-lit)}
.osi-tray[data-st="on"] .iso-top{fill:var(--anatomy-lit-top)}
.osi-index{transition:transform .8s var(--anatomy-ease)}
.osi-led circle{fill:var(--anatomy-lo)}
.osi-led [data-led="link"]{fill:#3fbf6f}
.osi-led[data-act] [data-led="act"]{fill:#e8a33a;animation:osi-blink .16s steps(2) infinite}
@keyframes osi-blink{50%{fill:var(--anatomy-lo)}}
.osi-bits circle{display:none;fill:var(--anatomy-lit)}
.osi-bits[data-run] circle{display:block}
.osi-bits circle[data-on="0"]{fill:var(--anatomy-mid)}
.osi-tags{position:absolute;inset:0;pointer-events:none;font-size:clamp(9px,1.55cqw,12px);line-height:1;color:var(--anatomy-muted)}
.osi-tag{position:absolute;white-space:nowrap;transform:translate(-100%,-50%);padding-right:.6em;transition:color .3s,opacity .3s}
.osi-tag[data-side="r"]{transform:translate(0,-50%);padding:0 0 0 .6em}
.osi-tag b{font-family:var(--anatomy-mono);font-weight:500;color:var(--anatomy-text);margin-right:.2em}
.osi-tag[data-st="on"]{color:var(--anatomy-strong)}
.osi-tag[data-st="on"] b{color:var(--anatomy-strong)}
.osi-tag[data-st="dim"]{opacity:.45}
.osi-host{position:absolute;white-space:nowrap;transform:translate(-50%,-100%);font-size:1.08em;color:var(--anatomy-text);letter-spacing:.04em}
.osi-grp{position:absolute;display:none;border-left:1px solid var(--anatomy-mid);padding-left:.6em;align-items:center}
.osi-grp i{font-style:normal;color:var(--anatomy-strong);white-space:nowrap}
.osi-fig[data-cmp] .osi-grp{display:flex}
@media (prefers-reduced-motion:reduce){.osi-blk,.osi-index,.osi-tag{transition:none}.osi-led[data-act] [data-led="act"]{animation:none}}

/* 版面滑桿：--fig 是圖占的比例，面板寬度與圖的位置都跟著它。 */
:root{--fig:.62;--pw:max(300px,calc((100vw - 136px) * (1 - var(--fig))))}
.sz{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);border:1px solid var(--rule);background:var(--btn);border-radius:99px;padding:4px 12px}
.sz input{width:110px;accent-color:var(--ink)}
#stage{position:fixed;left:calc(56px + var(--pw) + 24px);right:40px;top:96px;bottom:84px;z-index:0;display:grid;place-items:center;background:none;--anatomy-paper:var(--bg);--anatomy-card:var(--bg)}
#stage .osi-fig{width:min(100%,calc((100vh - 200px) * 1.5319))}
#stage{transition:left .2s}
#stage .osi-tags{font-family:var(--sans)}
#stage .osi-tag b{font-family:var(--mono)}
/* 3D labels */
.lbl{pointer-events:none;white-space:nowrap;transition:opacity .2s}
.lbl .in{display:flex;align-items:baseline;gap:6px;transform:translateX(calc(50% + 0px));font-size:13px;color:var(--ink)}
.lbl.left .in{transform:translateX(-50%);flex-direction:row-reverse}
.lbl b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--c);letter-spacing:.04em}
.lbl i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink3)}
.lbl.sm .in{font-size:12px}
.lbl.center .in{transform:none}
.lbl.title .in{transform:none;font-size:12px;letter-spacing:.12em;color:var(--ink2);padding:3px 8px;border:1px solid var(--rule);background:var(--btn);border-radius:99px}
.lbl.tag .in{transform:none;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}

/* header */
#top{position:fixed;left:56px;right:40px;top:28px;height:44px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.06em;color:var(--ink2)}
.brand b{color:var(--ink);font-weight:500}
.brand .div{width:1px;height:22px;background:var(--rule)}
.ctl{display:flex;gap:8px}
.ctl button,#tools button,#bar button,.btn{border:1px solid var(--rule);background:var(--btn);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:7px 14px;font-size:13px;transition:background .2s,border-color .2s}
.ctl button:hover,#tools button:hover,#bar button:hover,.btn:hover{border-color:var(--ink3)}
.ctl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--l3);outline-offset:2px}

#tools{position:fixed;right:40px;top:84px;z-index:3;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink3)}

/* panel */
#panel{position:fixed;left:56px;top:100px;bottom:92px;width:var(--pw);z-index:2;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;padding-right:8px}
.pg{display:none}
.pg.on{display:block;animation:pgIn .55s cubic-bezier(.2,.7,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--ink2);margin-top:28px}
.eyebrow .num{font-size:12px;color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:1px 6px}
.eyebrow .sep{flex:0 0 18px;height:1px;background:var(--rule)}
h1.one{white-space:nowrap;font-size:min(54px,calc(var(--pw) / 6.4))}
h1{font-size:54px;line-height:1.12;font-weight:500;letter-spacing:.02em;margin:22px 0 18px}
h2{font-size:34px;line-height:1.25;font-weight:500;letter-spacing:.02em;margin:18px 0 14px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
h2 em{font-style:normal;font-family:var(--mono);font-weight:300;font-size:16px;color:var(--ink3)}
h2 .badge{font-family:var(--mono);font-size:14px;font-weight:500;color:#fff;background:var(--c,var(--ink));border-radius:4px;padding:3px 8px;align-self:center}
h3{font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--ink2);margin:24px 0 10px}
.lede{font-size:16px;line-height:1.85;color:var(--ink2);margin:0 0 20px;font-weight:300}
.lede b{color:var(--ink);font-weight:500}
.hint{font-size:13px;color:var(--ink3);line-height:1.7;margin-top:28px}
.foot{font-size:11.5px;color:var(--ink3);line-height:1.7;margin-top:26px;border-top:1px solid var(--rule);padding-top:12px}

.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;border-top:1px solid var(--rule);padding-top:14px}
.figs.three{grid-template-columns:repeat(3,1fr);gap:0 16px}
.fig .n{font-family:var(--mono);font-size:34px;font-weight:300;line-height:1.1}
.fig .n small{font-family:var(--sans);font-size:14px;margin-left:3px;color:var(--ink2)}
.fig .k{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.5}
.fig .v{font-size:14.5px;line-height:1.5;margin-top:4px;color:var(--ink)}

ul.does{list-style:none;margin:0;padding:0}
ul.does li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.65;color:var(--ink)}
ul.does li::before{content:"";position:absolute;left:2px;top:17px;width:8px;height:8px;border-radius:2px;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--rule);background:var(--card)}
.analogy{margin-top:22px;padding:14px 16px;border-left:3px solid var(--c);background:var(--card);border-radius:0 6px 6px 0}
.analogy .k{font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.analogy p{margin:6px 0 0;font-size:15px;line-height:1.75}

/* overview rows */
.stack{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 4px;transition:background .2s,padding .25s}
.row:hover,.row.hl{background:var(--card);padding-left:10px}
.row .L{font-family:var(--mono);font-size:12px;font-weight:500;color:#fff;background:var(--c);border-radius:4px;text-align:center;padding:2px 0}
.row .nm{font-size:15px}
.row .nm small{display:block;font-size:12.5px;color:var(--ink3);margin-top:2px}
.row .pdu-s{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.group-tag{font-size:11.5px;color:var(--ink3);letter-spacing:.08em;margin:14px 0 6px}
.mnemo{margin-top:20px;font-size:13.5px;line-height:1.8;color:var(--ink2)}
.mnemo b{font-family:var(--mono);font-weight:500;color:var(--ink)}

/* encapsulation */
.enc-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.scrub{width:100%;accent-color:var(--ink)}
.scrub-k{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.enc-now{display:flex;align-items:baseline;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.enc-now .side{font-size:12px;letter-spacing:.08em;color:var(--ink3)}
.enc-now .lay{font-size:22px;font-weight:500}
.enc-now .pduN{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:4px;background:var(--ink);color:var(--bg)}
.pdu{display:flex;height:46px;border-radius:6px;overflow:hidden;border:1px solid var(--rule);background:var(--card)}
.pdu .b{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:#fff;border-right:1px solid rgba(255,255,255,.35);min-width:0;overflow:hidden;white-space:nowrap}
.pdu .b:last-child{border-right:0}
.pdu .b.gone{opacity:.28}
.pdu-k .tot{margin-left:auto;font-family:var(--mono)}
.pdu-k .tot::before{display:none}
.pdu .b.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1.2)}
@keyframes pop{from{transform:scaleX(.2);opacity:0}to{transform:none;opacity:1}}
.pdu.bits{align-items:center;padding:0 12px;font-family:var(--mono);font-size:14px;letter-spacing:.18em;color:var(--ink2);overflow:hidden;white-space:nowrap}
.pdu-k{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--ink3);margin-top:8px}
.pdu-k span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
.enc-note{font-size:15px;line-height:1.8;margin-top:16px;min-height:5.4em}

/* compare */
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:12px;font-weight:400;color:var(--ink3);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--rule)}
.cmp td{padding:11px 6px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.55}
.cmp td small{display:block;color:var(--ink3);font-family:var(--mono);font-size:11px}
.dots{display:inline-flex;gap:3px;flex-wrap:wrap}
.dots i{font-style:normal;font-family:var(--mono);font-size:11px;color:#fff;background:var(--c);border-radius:3px;padding:1px 5px}

/* quiz */
.qcard{border:1px solid var(--rule);background:var(--card);border-radius:8px;padding:16px 18px}
.qcard .qn{font-family:var(--mono);font-size:11.5px;color:var(--ink3)}
.qcard p{font-size:17px;line-height:1.7;margin:8px 0 0}
.qbtns{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.qbtns button{border:1px solid var(--rule);background:var(--btn);border-radius:6px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,border-color .2s,background .2s}
.qbtns button b{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--c)}
.qbtns button span{font-size:11px;color:var(--ink2)}
.qbtns button:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
.qbtns button:disabled{cursor:default}
.qbtns button.right{background:var(--c);border-color:var(--c)}
.qbtns button.right b,.qbtns button.right span{color:#fff}
.qbtns button.wrong{border-color:var(--bad);border-style:dashed;opacity:.8}
.fb{min-height:5.2em;font-size:14.5px;line-height:1.75;margin-top:14px}
.fb .res{font-weight:500}
.fb .res.ok{color:var(--ok)} .fb .res.no{color:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--ink2)}

/* bottom bar */
#bar{position:fixed;left:56px;right:40px;bottom:28px;height:40px;z-index:3;display:flex;align-items:center;gap:10px}
#bar #bPrev,#bar #bNext{width:40px;height:40px;padding:0;display:grid;place-items:center}
#ticks{display:flex;gap:4px;align-items:center}
#ticks button{border:0;background:none;padding:6px 3px;font-family:var(--mono);font-size:11px;color:var(--ink3);position:relative;border-radius:4px}
#ticks button::after{content:"";position:absolute;left:3px;right:3px;bottom:1px;height:2px;border-radius:2px;background:var(--rule);transition:background .3s}
#ticks button.on{color:var(--ink)}
#ticks button.on::after{background:var(--ink)}
#ticks button:hover{color:var(--ink)}
#curT{font-size:13px;color:var(--ink2);margin-left:6px;white-space:nowrap}
#progress{position:fixed;left:0;top:0;height:2px;background:var(--ink);z-index:4;width:0;transition:width .25s linear}

@media (max-width:820px){
  .veil{display:none}
  #top{left:16px;right:16px;top:10px}
  .brand span:not(.div){display:none}.brand .div{display:none}
  .ctl button{padding:6px 10px;font-size:12px}
  #stage{left:8px;right:8px;bottom:auto;--sh:min(calc(var(--fig) * 70svh),calc((100vw - 16px) / 1.5319 + 12px));height:var(--sh);top:52px}
  #stage .osi-fig{width:min(100%,calc(var(--sh) * 1.5319))}
  #stage .osi-fig[data-cmp] .osi-grp{display:none}
  .sz{position:fixed;right:16px;top:calc(52px + min(var(--fig) * 70svh,(100vw - 16px) / 1.5319 + 12px) - 30px);padding:3px 10px;z-index:3}.sz span{display:none}.sz input{width:90px}
  #panel{left:16px;right:16px;width:auto;top:calc(52px + min(var(--fig) * 70svh,(100vw - 16px) / 1.5319 + 12px));bottom:64px;padding-right:0;border-top:1px solid var(--rule)}
  .eyebrow{margin-top:16px}
  h1,h1.one{font-size:38px;margin:14px 0}
  h2{font-size:26px}
  .figs.three{grid-template-columns:repeat(3,1fr)}
  .fig .n{font-size:26px}
  #bar{left:16px;right:16px;bottom:12px}
  #ticks{overflow-x:auto;scrollbar-width:none;flex:1}
  #curT{display:none}
  .qbtns{grid-template-columns:repeat(4,1fr)}
  /* 手機版 Encapsulation 章節的兩座小堆疊太窄，隱藏層名，只留 Host 標題與 packet 標籤 */
  .lbl.sm{display:none}
  /* 畫面窄，3D 標籤只留中文層名 */
  .lbl i{display:none}
  /* 對照章節只留 TCP/IP 方塊上的標籤，OSI 對應關係看面板表格 */
  body[data-mode="cmp"] .lbl.main{display:none}
}
@media (prefers-reduced-motion:reduce){
  .pg.on,.pdu .b.pop{animation:none}
}
</style>

    else { at.s = 1; at.r = st.L; }
  } else if (state.focus) at.s = at.r = state.focus;
  for (const id of ["s", "r"]) for (const g of index[id]) g.style.transform = `translateY(${-DATA.rise[at[id]]}px)`;
  wire = state.mode === "enc" && st.side === "w";
  for (const id of ["s", "r"]) leds[id].toggleAttribute("data-act", wire);
  root.toggleAttribute("data-cmp", state.mode === "cmp");
  runBits();
  say();
}

function say() {
  let text;
  if (state.mode === "enc") {
    const st = STEPS[state.step], l = byN[st.L];
    if (st.side === "s") text = `↓ L${l.n} ${l.name} · ${l.pduEn} ${l.bytes} B${l.added && l.n !== 7 ? `（+${l.added} B）` : ""}`;
    else if (st.side === "w") text = `wire 上 · ${DATA.bits} 個 bits`;
    else text = `↑ L${l.n} ${l.name} · ${l.n === 7 ? `${l.pduEn} ${l.bytes} B` : l.added ? `拆掉 ${l.added} B → ${l.bytes - l.added} B` : `沒有 header 可拆 · ${l.bytes} B`}`;
  } else if (state.focus) {
    const l = byN[state.focus];
    text = `L${l.n} ${l.name} · ${l.pduEn} ${l.bytes} B`;
  } else text = `一筆 request · ${byN[7].bytes} B → 線上 ${byN[1].bytes} B`;
  fig.onSay?.(text);
}

let touring = false, tourTimer = 0;
function tourNext() {
  clearTimeout(tourTimer);
  if (!touring) return;
  const st = STEPS[state.step];
  const wait = st.side === "w" ? 2600 : state.step === STEPS.length - 1 ? 3200 : 1700;
  tourTimer = setTimeout(() => {
    if (!touring) return;
    fig.set({ mode: "enc", step: (state.step + 1) % STEPS.length });
    tourNext();
  }, wait);
}

const fig = {
  STEPS,
  set(next) {
    const prev = state;
    state = { mode: "full", focus: 0, pick: 0, step: 0, ...next };
    apply(prev);
  },
  get state() { return state; },
  tour(on) {
    touring = on && !still.matches;
    if (touring) { if (state.mode !== "enc") fig.set({ mode: "enc", step: 0 }); tourNext(); }
    else clearTimeout(tourTimer);
  },
  onSay: null,
  onPick: null,
};
window.osiFig = fig;

// 點托盤（或它旁邊的層名）選層：用托盤的螢幕位置判斷點到哪一層。
svg.addEventListener("click", (event) => {
  const box = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const x = ((event.clientX - box.left) / box.width) * vb.width;
  const y = ((event.clientY - box.top) / box.height) * vb.height;
  // 由上往下找：DOM 順序就是繪製順序，最後畫的那一塊在最上面。
  const p = new DOMPoint(x, y);
  const hit = [...root.querySelectorAll(".osi-tray, .osi-blk")].reverse().find((g) => [...g.querySelectorAll(".iso-fill")].some((f) => f.isPointInFill(p)));
  const best = hit && { n: +hit.dataset.t.slice(1), side: hit.dataset.t[0] };
  if (best) fig.onPick?.(best.n, best.side);
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; runBits(); }).observe(root);
apply(null);
})();

const fig = window.osiFig;
const stage = document.getElementById('stage');
const mqMobile = matchMedia('(max-width:820px)');
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const MODEL = Object.fromEntries([{"n":7,"blocks":[{"id":"http","bytes":37}],"bytes":37},{"n":6,"blocks":[{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17}],"bytes":59},{"n":5,"blocks":[{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17}],"bytes":59},{"n":4,"blocks":[{"id":"tcp","bytes":20},{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17}],"bytes":79},{"n":3,"blocks":[{"id":"ip","bytes":20},{"id":"tcp","bytes":20},{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17}],"bytes":99},{"n":2,"blocks":[{"id":"eth.h","bytes":14},{"id":"ip","bytes":20},{"id":"tcp","bytes":20},{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17},{"id":"eth.t","bytes":4}],"bytes":117},{"n":1,"blocks":[{"id":"phy","bytes":8},{"id":"eth.h","bytes":14},{"id":"ip","bytes":20},{"id":"tcp","bytes":20},{"id":"tls.h","bytes":5},{"id":"http","bytes":37},{"id":"tls.t","bytes":17},{"id":"eth.t","bytes":4}],"bytes":125}].map(l=>[l.n,l]));
const BLOCK_TXT = {http:'HTTP','tls.h':'TLS','tls.t':'TLS tag',tcp:'TCP',ip:'IP','eth.h':'Ethernet','eth.t':'FCS',phy:'preamble'};
const BLOCK_L = {"http":7,"tls.h":6,"tls.t":6,"tcp":4,"ip":3,"eth.h":2,"eth.t":2,"phy":1};

/* ───────────── 狀態 ───────────── */
let cur = -1, hoverL = 0, auto = false, autoAcc = 0;
const enc = {step:0, playing:true, acc:0};
const STEPS = [];
for(let L=7;L>=1;L--) STEPS.push({side:'s',L});
STEPS.push({side:'w',L:1});
for(let L=1;L<=7;L++) STEPS.push({side:'r',L});
const quiz = {i:0, answered:false, pick:0, right:0, done:0};

function modeOf(ch){ return ch.kind==='encap'?'enc':ch.kind==='compare'?'cmp':'stack'; }

function computeTargets(){
  const ch = CH[cur]; const mode = modeOf(ch);
  document.body.dataset.mode = mode;
  if(ch.kind==='cover'){ if(!fig.state || fig.state.mode!=='enc' || !touring) { touring = true; fig.tour(true); } return; }
  touring = false; fig.tour(false);
  if(mode==='enc') return fig.set({mode:'enc', step:enc.step});
  if(mode==='cmp') return fig.set({mode:'cmp'});
  if(ch.kind==='layer') return fig.set({focus:ch.L});
  if(ch.kind==='quiz' && quiz.answered){ const c = QUIZ[quiz.i].L; return fig.set({focus:c, pick:quiz.pick===c?0:quiz.pick}); }
  fig.set({focus:hoverL});
}
let touring = false;

/* ───────────── 章節切換 ───────────── */
const curT = document.getElementById('curT');
function go(i, instant){
  i = Math.max(0,Math.min(CH.length-1,i));
  if(i===cur) return;
  cur = i;
  sections.forEach((s,j)=>s.classList.toggle('on',j===i));
  tickBtns.forEach((b,j)=>b.classList.toggle('on',j===i));
  tickBtns[i].scrollIntoView({block:'nearest',inline:'center'});
  panel.scrollTop = 0;
  curT.textContent = `${pad(i)}　${CH[i].t}`;
  history.replaceState(null,'','#'+i);
  const ch = CH[i];
  if(ch.kind==='encap'){ enc.step=0; enc.playing=!reduced; enc.acc=0; renderEnc(); }
  if(ch.kind==='quiz') renderQuiz();
  hoverL = 0;
  computeTargets();
  autoAcc = 0;
}
ticks.addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(+b.dataset.go); });
document.getElementById('bPrev').onclick = ()=>go(cur-1);
document.getElementById('bNext').onclick = ()=>go(cur+1);

// 總覽列：滑過連動模型、點選跳章
panel.addEventListener('click',e=>{
  const r = e.target.closest('.row'); if(r) go(chOfLayer(+r.dataset.layer));
});
panel.addEventListener('pointerover',e=>{
  const r = e.target.closest('.row');
  const L = r ? +r.dataset.layer : 0;
  if(L!==hoverL && CH[cur].kind==='overview'){ hoverL = L; computeTargets(); }
});

/* Encapsulation 控制 */
const $ = id => document.getElementById(id);
let prevBlocks = [];
function renderEnc(){
  const st = STEPS[enc.step], L = st.L, d = LAYERS[L];
  $('eSide').textContent = st.side==='s'?'Host A　往下 Encapsulation':st.side==='w'?'傳輸 wire':'Host B　往上 Decapsulation';
  $('eLay').textContent = st.side==='w' ? 'bits 在 wire 上' : `L${L} ${d.zh}`;
  $('ePdu').textContent = st.side==='w' ? 'Bits' : PDU[L];
  $('eNote').innerHTML = st.side==='s'?SNOTE[L]:st.side==='w'?WNOTE:RNOTE[L];
  $('eScrub').value = enc.step;
  $('ePlay').textContent = enc.playing?'Ⅱ 暫停':'▶ 播放';
  const bar = $('eBar');
  if(st.side==='w'){
    bar.className = 'pdu bits';
    bar.textContent = '10101010 10101010 10101010 … 10101011 0110100101110010';
    $('eKey').innerHTML = `<span style="--c:${LAYERS[1].color}">整個 frame 加上 preamble，變成 ${MODEL[1].bytes * 8} 個 bits</span>`;
    prevBlocks = [];
  } else {
    bar.className = 'pdu';
    const blocks = MODEL[L].blocks;
    const own = new Set(st.side==='r' && L<7 ? blocks.filter(b=>BLOCK_L[b.id]===L).map(b=>b.id) : []);
    bar.innerHTML = blocks.map(b=>`<div class="b ${prevBlocks.includes(b.id)?'':'pop'}${own.has(b.id)?' gone':''}" style="flex:${b.bytes};background:${LAYERS[BLOCK_L[b.id]].color}" title="${BLOCK_TXT[b.id]} ${b.bytes} B">${b.bytes>=12?BLOCK_TXT[b.id]+' '+b.bytes:''}</div>`).join('');
    prevBlocks = blocks.map(b=>b.id);
    const seen = [...new Set(blocks.map(b=>BLOCK_L[b.id]))];
    $('eKey').innerHTML = seen.map(n=>`<span style="--c:${LAYERS[n].color}">${n===7?'application data':'L'+n+' '+LAYERS[n].zh}</span>`).join('') + `<span class="tot">共 ${MODEL[L].bytes} B</span>`;
  }
  if(CH[cur]?.kind==='encap') computeTargets();
}
function encGo(s){ enc.step = Math.max(0,Math.min(STEPS.length-1,s)); enc.acc = 0; renderEnc(); }
$('eBack').onclick = ()=>{ enc.playing=false; encGo(enc.step-1); };
$('eFwd').onclick = ()=>{ enc.playing=false; encGo(enc.step+1); };
$('ePlay').onclick = ()=>{ if(enc.step===STEPS.length-1){ enc.step=0; prevBlocks=[]; } enc.playing=!enc.playing; enc.acc=0; renderEnc(); };
$('eRe').onclick = ()=>{ prevBlocks=[]; enc.playing=true; encGo(0); };
$('eScrub').oninput = e=>{ enc.playing=false; encGo(+e.target.value); };

/* 測驗 */
function renderQuiz(){
  const q = QUIZ[quiz.i];
  $('qN').textContent = `情境 ${quiz.i+1} / ${QUIZ.length}`;
  $('qT').textContent = q.q;
  $('qB').querySelectorAll('button').forEach(b=>{ b.disabled=false; b.className=''; });
  $('qF').innerHTML = '';
  $('qS').textContent = quiz.done ? `答對 ${quiz.right} / ${quiz.done}` : '';
  $('qNext').style.visibility = 'hidden';
}
function answer(L){
  if(quiz.answered || CH[cur].kind!=='quiz') return;
  const q = QUIZ[quiz.i];
  quiz.answered = true; quiz.pick = L; quiz.done++;
  const ok = L===q.L; if(ok) quiz.right++;
  $('qB').querySelectorAll('button').forEach(b=>{
    const v = +b.dataset.ans; b.disabled = true;
    if(v===q.L) b.className='right'; else if(v===L) b.className='wrong';
  });
  const d = LAYERS[q.L];
  $('qF').innerHTML = ok
    ? `<span class="res ok">答對了｜L${q.L} ${d.zh}</span><br>${q.why}`
    : `<span class="res no">不是 L${L} ${LAYERS[L].zh}</span>，正確答案是 <b>L${q.L} ${d.zh}</b>。<br>${q.why}`;
  $('qS').textContent = `答對 ${quiz.right} / ${quiz.done}`;
  $('qNext').style.visibility = 'visible';
  $('qNext').textContent = quiz.i===QUIZ.length-1 ? '從頭再來 ↻' : '下一題 →';
  computeTargets();
}
$('qB').addEventListener('click',e=>{ const b=e.target.closest('[data-ans]'); if(b) answer(+b.dataset.ans); });
$('qNext').onclick = ()=>{
  if(quiz.i===QUIZ.length-1){ quiz.i=0; quiz.right=0; quiz.done=0; } else quiz.i++;
  quiz.answered=false; quiz.pick=0; renderQuiz(); computeTargets();
};

/* 拾取：點層架上的托盤 */
fig.onPick = (L)=>{
  const ch = CH[cur];
  if(ch.kind==='encap') return;
  if(ch.kind==='quiz') answer(L); else go(chOfLayer(L));
};

/* 頂部控制 */
const bAuto = $('bAuto');
bAuto.onclick = ()=>{ auto=!auto; autoAcc=0; bAuto.setAttribute('aria-pressed',auto); bAuto.textContent = auto?'Ⅱ 自動播放':'▶ 自動播放'; };
function themeNow(){ return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'); }
function applyTheme(){
  stage.dataset.theme = themeNow();
}
// 版面比例只是這位讀者的偏好，記在 browser 裡；讀不到就用預設值。
const bSize = $('bSize');
function setSize(v){ document.documentElement.style.setProperty('--fig', v); bSize.value = v; }
try { const v = localStorage.getItem('osi-fig'); if(v) setSize(v); } catch {}
bSize.addEventListener('input', ()=>{ setSize(bSize.value); try { localStorage.setItem('osi-fig', bSize.value); } catch {} });
$('bTheme').onclick = ()=>{ document.documentElement.dataset.theme = themeNow()==='dark'?'light':'dark'; applyTheme(); };
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function toggleFull(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.(); }
$('bFull').onclick = toggleFull;

addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')) return;
  const k = e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button'))){ e.preventDefault(); go(cur+1); }
  else if(k==='ArrowLeft'||k==='PageUp'){ e.preventDefault(); go(cur-1); }
  else if(k==='f'||k==='F') toggleFull();
  else if(k==='Home') go(0);
  else if(k==='End') go(CH.length-1);
  else if(CH[cur].kind==='quiz' && /^[1-7]$/.test(k)) answer(+k);
});

addEventListener('hashchange',()=>{ const n = parseInt(location.hash.slice(1)); if(Number.isFinite(n)) go(n); });

/* ───────────── 主迴圈 ───────────── */
let lastT = 0;
const progress = $('progress');
function tick(now){
  const dt = lastT ? Math.min((now-lastT)/1000,.25) : 0; lastT = now;
  // Encapsulation 自動前進
  if(CH[cur]?.kind==='encap' && enc.playing){
    enc.acc += dt;
    if(enc.acc>(STEPS[enc.step].side==='w'?2.6:1.6)){
      if(enc.step<STEPS.length-1) encGo(enc.step+1);
      else { enc.playing=false; renderEnc(); }
    }
  }
  // 自動播放章節
  if(auto){
    const ch = CH[cur];
    const busy = ch.kind==='encap' && enc.playing;
    if(!busy) autoAcc += dt;
    const need = ch.kind==='encap'?2.5:8;
    progress.style.width = (busy?0:Math.min(1,autoAcc/need)*100)+'%';
    if(autoAcc>need){
      if(cur>=CH.length-2){ go(cur+1); bAuto.click(); progress.style.width='0'; }
      else go(cur+1);
    }
  } else progress.style.width = '0';
  requestAnimationFrame(tick);
}

/* 啟動 */
applyTheme();
const start = parseInt(location.hash.slice(1));
go(Number.isFinite(start)?start:0, true);
requestAnimationFrame(tick);
</script>
</body>
